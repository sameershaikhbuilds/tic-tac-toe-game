<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic Tac Toe Game</title>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #548687;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

  .head1{
      font-size: 2.5rem;
      color: white;
      margin-bottom: 20px;
    }

  .container{
      padding: 15px;
      border-radius: 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }

  .game{
      height: 320px;
      width: 320px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

  .box{
      height: 100px;
      width: 100px;
      border-radius: 0.8rem;
      border: none;
      font-size: 3rem;
      font-weight: bold;
      color: #b0413e;
      cursor: pointer;
      box-shadow: 0 0 1rem rgba(0,0,0,0.1);
      background-color: #ffffc7;
    }

  .box:hover {
      background-color: #f0f0a0;
    }

  .box:disabled {
      cursor: not-allowed;
    }

   .msg-container {
      height: 3rem; /* Reserve space so button doesn't move */
      margin: 1.5rem 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #msg {
      font-size: 2rem;
      color: #ffffc7;
      font-weight: bold;
    }

    #reset {
      padding: 1rem 2rem;
      font-size: 1.2rem;
      background-color: #191913;
      color: white;
      border-radius: 1rem;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <main>
    <h1 class="head1">Tic Tac Toe</h1>
    <div class="container">
      <div class="game">
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
      </div>
    </div>

    <div class="msg-container">
      <p id="msg"></p> <!-- Winner/Draw message -->
    </div>

    <button id="reset">Reset Game</button>
  </main>

  <script>
    let boxes = document.querySelectorAll(".box");
    let reset = document.querySelector("#reset");
    let msg = document.querySelector("#msg");

    let turnO = true;
    let count = 0;

    const winPatterns = [
      [0,1,2], [0,3,6], [0,4,8],
      [1,4,7], [2,5,8], [2,4,6],
      [3,4,5], [6,7,8]
    ];

    const resetGame = () => {
      turnO = true;
      count = 0;
      msg.innerText = "";
      boxes.forEach((box) => {
        box.innerText = "";
        box.disabled = false;
      });
    };

    boxes.forEach((box) => {
      box.addEventListener("click", () => {
        if (turnO) {
          box.innerText = "O";
          turnO = false;
        } else {
          box.innerText = "X";
          turnO = true;
        }
        box.disabled = true;
        count++;
        checkWinner();
      });
    });

    const checkWinner = () => {
      for (let pattern of winPatterns) {
        let pos1 = boxes[pattern[0]].innerText;
        let pos2 = boxes[pattern[1]].innerText;
        let pos3 = boxes[pattern[2]].innerText;

        if (pos1!== "" && pos1 === pos2 && pos2 === pos3) {
          showWinner(pos1);
          return;
        }
      }
      if(count === 9) {
        msg.innerText = "It's a Draw!";
      }
    };

    const showWinner = (winner) => {
      msg.innerText = `Winner: ${winner}`;
      boxes.forEach(box => box.disabled = true);
    };

    reset.addEventListener("click", resetGame);
  </script>
</body>
</html>
